name: Construir App Android Negocios (APK y AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Construir APK y AAB Negocios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📦 Descargar Código Fuente
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (Para Capacitor)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📥 Instalar Librerías de Node
        run: npm install

      - name: 📁 Preparar Carpeta 'out'
        run: mkdir -p out

      - name: 🔄 Sincronizar Motor Android (Capacitor)
        run: npx cap sync android

      - name: ☕ Configurar Java (Para compilar Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🔑 Dar Permisos al Compilador
        working-directory: android
        run: chmod +x gradlew

      - name: 🔨 Fabricar Archivo de Prueba .apk
        working-directory: android
        run: ./gradlew assembleDebug

      - name: 🔨 Fabricar App Bundle .aab de Producción
        working-directory: android
        run: ./gradlew bundleRelease

      - name: 🔑 Firmar App Bundle de Producción
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Firmando con Keystore de GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "$STORE_PASS" -keypass "$KEY_PASS" app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          else
            echo "Firmando con Keystore dedicado generado..."
            keytool -genkeypair -v -keystore release.keystore -alias redeconomix_negocios -keyalg RSA -keysize 2048 -validity 10000 -storepass RedEconomiX2026! -keypass RedEconomiX2026! -dname "CN=RedEconomiX Negocios, OU=RedEconomiX, O=RedEconomiX, L=Cordoba, ST=Cordoba, C=AR"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass RedEconomiX2026! -keypass RedEconomiX2026! app/build/outputs/bundle/release/app-release.aab redeconomix_negocios
          fi
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/app-release-signed.aab

      - name: 🔐 Guardar Keystore de Firma
        uses: actions/upload-artifact@v4
        with:
          name: RedEconomiX-Negocios-Keystore
          path: android/release.keystore
          retention-days: 30

      - name: 🔗 Link de Descarga Rápida (Sin límites de GitHub)
        working-directory: android
        run: |
          echo "=========================================================="
          echo "⬇️ DESCARGA TU APK DESDE AQUÍ SI GITHUB ESTÁ LLENO ⬇️"
          curl -T app/build/outputs/apk/debug/app-debug.apk https://transfer.sh/RedEconomiX-Negocios.apk || echo "Error al subir a transfer.sh"
          echo ""
          echo "=========================================================="

      - name: 🚀 Subir APK de Prueba
        uses: actions/upload-artifact@v4
        with:
          name: RedEconomiX-Negocios-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 🏷️ Publicar Release con APK Directo (Sin ZIP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "RedEconomiX Negocios - APK Directo"
          body: "Descarga directa del APK de RedEconomiX Negocios para Android sin comprimir."
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🚀 Subir AAB de Producción Firmado
        uses: actions/upload-artifact@v4
        with:
          name: RedEconomiX-Negocios-AAB-Production-Signed
          path: |
            android/app/build/outputs/bundle/release/*signed*.aab
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
